# GENERATED by deploy/observability/gen_alerts.py - do not edit by hand.
# Off-node alerting rules (operations.md §9). Phase 1 never sends orders: these only page people.
# Load into Amazon Managed Service for Prometheus (rule groups namespace) or a self-run Prometheus;
# Alertmanager (alertmanager/alertmanager.yml) routes them to SNS. Metrics: metrics.md.
groups:
  - name: xtnl-offnode
    interval: 10s
    rules:
      - alert: XtnlNoLeader
        expr: "(sum(xtnl_node_role{role=\"LEADER\"} == 1) or vector(0)) < 1"
        for: 30s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "No engine node is LEADER: ingestion and Oversee are not running"
          spec: "no LEADER for more than 30 s"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlnoleader"
      - alert: XtnlTwoLeaders
        expr: "count(xtnl_node_role{role=\"LEADER\"} == 1) > 1"
        for: 15s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "Two engine nodes report LEADER at once (fencing must resolve this within the lease TTL)"
          spec: "two LEADERs"
          runbook: "docs/runbooks/off-node-alerts.md#xtnltwoleaders"
      - alert: XtnlEngineDown
        expr: "up{job=\"xtnl-engine\"} == 0 or absent(up{job=\"xtnl-engine\"})"
        for: 60s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "An engine node's exporter is unreachable (process down, node lost or network cut)"
          spec: "standby not ready: a node's exporter / health record absent for more than 60 s"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlenginedown"
      - alert: XtnlHealthRecordStale
        expr: "(min by (subject) (xtnl_health_record_age_seconds) > 5) or (label_replace(count by (node) (xtnl_node_role), \"subject\", \"$1\", \"node\", \"(.*)\") unless on (subject) count by (subject) (xtnl_health_record_age_seconds))"
        for: 60s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "A node's etcd health record is absent or older than 5 s: it cannot take over"
          spec: "standby not ready: a peer's health record absent or stale for more than 60 s"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlhealthrecordstale"
      - alert: XtnlStandbyNotEligible
        expr: "max by (subject) (xtnl_health_campaign_eligible) == 0"
        for: 5m
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "A node fails a hard check or cannot campaign (back-off, SAFE_HOLD): no takeover target"
          spec: "standby not ready: a peer failing a hard check or unable to campaign for more than 5 min"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlstandbynoteligible"
      - alert: XtnlSpillFileNonEmpty
        expr: "max by (subject) (xtnl_health_spill_file_bytes) > 0"
        for: 60s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "A node's DLQ spill file is not draining into PostgreSQL"
          spec: "a non-empty spill file on any node for more than 60 s (from the health records)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlspillfilenonempty"
      - alert: XtnlSafeHold
        expr: "max(xtnl_safe_hold) == 1"
        for: 0s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "SAFE_HOLD is set: no node campaigns and the gate stays closed (operator resume needed)"
          spec: "SAFE_HOLD set: one off-node page"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlsafehold"
      - alert: XtnlEpochChangeRate
        expr: "max(xtnl_epoch_changes_30m) >= 3"
        for: 0s
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "3 or more epoch changes in 30 min (SAFE_HOLD at more than 6)"
          spec: "epoch-change rate"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlepochchangerate"
      - alert: XtnlEpochChangeSettling
        expr: "min(xtnl_epoch_change_age_seconds) < 120"
        for: 0s
        labels:
          severity: none
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "Epoch changed recently: dependent alerts are held back, then sent as one summary"
          spec: "inhibition: an epoch change suppresses dependent alerts for RTO + 30 s (120 s)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlepochchangesettling"
      - alert: XtnlLeaderNotOnPrimary
        expr: "max(xtnl_leader_colocated_with_primary) == 0"
        for: 10m
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "The engine leader is not on the Patroni primary's node: schedule a planned switchover"
          spec: "leader not on the Patroni primary's node for more than 10 min"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlleadernotonprimary"
      - alert: XtnlLeaseRenewSlow
        expr: "max(xtnl_lease_renew_p99_seconds) > 0.5"
        for: 1m
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "etcd lease keepalive p99 above 500 ms (fence at 12 s without renewal)"
          spec: "lease-renew p99 > 500 ms"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlleaserenewslow"
      - alert: XtnlEtcdUnhealthy
        expr: "max by (member) (xtnl_etcd_endpoint_healthy) == 0"
        for: 30s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "An etcd member does not answer from either engine node (quorum is 2 of 3)"
          spec: "etcd unhealthy (a member)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnletcdunhealthy"
      - alert: XtnlEtcdNoLeader
        expr: "max(xtnl_etcd_has_leader) == 0"
        for: 15s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "etcd has no raft leader: no lease can be renewed"
          spec: "etcd unhealthy (no raft leader)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnletcdnoleader"
      - alert: XtnlEtcdAlarm
        expr: "max(xtnl_etcd_alarms_active) > 0"
        for: 0s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "etcd raised an alarm (NOSPACE / CORRUPT): writes may be refused"
          spec: "any etcd alarm"
          runbook: "docs/runbooks/off-node-alerts.md#xtnletcdalarm"
      - alert: XtnlEtcdQuota50
        expr: "max by (member) (xtnl_etcd_db_quota_ratio) > 0.5"
        for: 5m
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "An etcd member's database is above 50 % of quota-backend-bytes (defrag / compaction)"
          spec: "etcd quota 50 %"
          runbook: "docs/runbooks/off-node-alerts.md#xtnletcdquota50"
      - alert: XtnlPatroniUnhealthy
        expr: "max by (member) (xtnl_patroni_member_running) == 0"
        for: 30s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "A Patroni member is not running / streaming"
          spec: "Patroni unhealthy (a member)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlpatroniunhealthy"
      - alert: XtnlPatroniNoLeader
        expr: "max(xtnl_patroni_has_leader) == 0"
        for: 30s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "The Patroni cluster has no primary"
          spec: "Patroni unhealthy (no primary)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlpatroninoleader"
      - alert: XtnlSyncStandbyMissing
        expr: "max(xtnl_patroni_sync_standby_count) < 1"
        for: 30s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "true"
        annotations:
          summary: "No synchronous standby: replication degraded to async, RPO 0 is lost"
          spec: "sync standby missing (sync-degraded)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlsyncstandbymissing"
      - alert: XtnlReplicationLag
        expr: "max by (member) (xtnl_pg_replication_lag_seconds) > 10"
        for: 1m
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "true"
        annotations:
          summary: "A standby replays more than 10 s behind the primary"
          spec: "replication lag"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlreplicationlag"
      - alert: XtnlPitrHorizonBroken
        expr: "(max by (member) (increase(xtnl_wal_archive_failed_total[5m])) > 0) or (max by (member) (changes(xtnl_pg_timeline[15m])) > 0)"
        for: 0s
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "WAL archiving failed or the timeline switched: xtnl-pitr-guard takes an incremental backup"
          spec: "PITR horizon broken: a dropped WAL or a timeline switch (operations.md §8)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlpitrhorizonbroken"
      - alert: XtnlDisk70
        expr: "max by (node, mount) (xtnl_disk_used_ratio) > 0.70"
        for: 5m
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "Disk above 70 % on an engine node"
          spec: "disk 70 %"
          runbook: "docs/runbooks/off-node-alerts.md#xtnldisk70"
      - alert: XtnlDisk85
        expr: "max by (node, mount) (xtnl_disk_used_ratio) > 0.85"
        for: 5m
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "Disk above 85 % on an engine node"
          spec: "disk 85 %"
          runbook: "docs/runbooks/off-node-alerts.md#xtnldisk85"
      - alert: XtnlWitnessDisk70
        expr: "1 - node_filesystem_avail_bytes{job=\"witness-node\", mountpoint=~\"/|/var/lib/etcd\"} / node_filesystem_size_bytes{job=\"witness-node\", mountpoint=~\"/|/var/lib/etcd\"} > 0.70"
        for: 5m
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "Disk above 70 % on the witness (or its disk metric is missing)"
          spec: "disk 70 % (witness)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlwitnessdisk70"
      - alert: XtnlWitnessDisk85
        expr: "1 - node_filesystem_avail_bytes{job=\"witness-node\", mountpoint=~\"/|/var/lib/etcd\"} / node_filesystem_size_bytes{job=\"witness-node\", mountpoint=~\"/|/var/lib/etcd\"} > 0.85"
        for: 5m
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "Disk above 85 % on the witness"
          spec: "disk 85 % (witness)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlwitnessdisk85"
      - alert: XtnlCertExpiry
        expr: "min by (node, cert) (xtnl_cert_expires_in_seconds) < 30 * 86400"
        for: 0s
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "A TLS certificate expires within 30 days"
          spec: "certificate expiry alert at 30 days"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlcertexpiry"
      - alert: XtnlCertUnreadable
        expr: "min by (node, cert) (xtnl_cert_readable) == 0 or (max by (node) (xtnl_exporter_up) unless on (node) count by (node) (xtnl_cert_readable{cert=~\"etcd-client|etcd-peer|etcd-server|pg-server|patroni-rest|patroni-etcd-client|patroni-ca|redis-proxy|redis-proxy-client-ca|ca|etcd-witness-server|etcd-witness-peer|deadman-receiver|dashboard-heartbeat\"}) >= 14)"
        for: 15m
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "A TLS certificate is unreadable, does not verify, or is not watched on this node"
          spec: "unreadable-certificate alert"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlcertunreadable"
      - alert: XtnlEventLoopLag
        expr: "max by (node) (xtnl_event_loop_lag_seconds) > 0.1"
        for: 30s
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "Engine event loop lagging more than 100 ms (watchdog kills at 3 s)"
          spec: "event-loop lag alert at 100 ms"
          runbook: "docs/runbooks/off-node-alerts.md#xtnleventlooplag"
      - alert: XtnlRedisMemoryHigh
        expr: "max by (node) (xtnl_redis_used_memory_ratio) > 0.8"
        for: 2m
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "Redis above 80 % of maxmemory (noeviction: writes fail at the limit)"
          spec: "Redis memory alert before the limit (noeviction)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlredismemoryhigh"
      - alert: XtnlFeedLengthHigh
        expr: "max(xtnl_feed_stream_length) > 500000"
        for: 1m
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "true"
        annotations:
          summary: "oversee:feed holds more than 50 % of its 1,000,000 cap"
          spec: "oversee:feed lag alert at 50 % of the MAXLEN cap"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlfeedlengthhigh"
      - alert: XtnlFeedPendingOld
        expr: "max(xtnl_feed_oldest_pending_age_seconds) > 30"
        for: 30s
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "true"
        annotations:
          summary: "The Oversee feed observer is not acknowledging entries"
          spec: "oldest un-acked feed entry > 30 s"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlfeedpendingold"
      - alert: XtnlArmFailed
        expr: "max(xtnl_arm_failed_scopes) > 0"
        for: 1m
        labels:
          severity: critical
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "The ARM has a FAILED scope: no advice for its positions until it is cleared (see arm failed show)"
          spec: "ARM FAILED scopes (arm_failed_scopes) off-node backstop"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlarmfailed"
      - alert: XtnlRedisMdMemoryHigh
        expr: "max by (node) (xtnl_md_redis_used_memory_ratio) > 0.7"
        for: 2m
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "redis-md above 70 % of maxmemory (noeviction; md-writer sheds TICK data in its fixed order)"
          spec: "redis-md memory at 70 % of maxmemory (design §A2)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlredismdmemoryhigh"
      - alert: XtnlClockOffset
        expr: "max by (node) (abs(xtnl_clock_offset_seconds)) > 0.05"
        for: 1m
        labels:
          severity: warning
          team: xtnl
          depends_on_epoch: "false"
        annotations:
          summary: "Clock offset above 50 ms: the node fails its hard check"
          spec: "chrony synced within 50 ms (hard check)"
          runbook: "docs/runbooks/off-node-alerts.md#xtnlclockoffset"
