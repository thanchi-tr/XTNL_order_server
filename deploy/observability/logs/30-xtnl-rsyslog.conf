# XTNL log shipping, step 1 of 2 (operations.md §9 "Logs: structured JSON ... shipped off-node";
# IMPLEMENTATION_PLAN 6.4). Install as /etc/rsyslog.d/30-xtnl.conf on both engine nodes, then
#     sudo systemctl restart rsyslog
#
# journald (ForwardToSyslog=yes, logs/journald-xtnl.conf) -> rsyslog -> /var/log/xtnl/<identifier>.log, one raw
# message per line (the engine's JSON line exactly as src/observability/logs.py wrote it, without a syslog
# prefix) -> CloudWatch agent (cloudwatch/agent-prometheus.json logs_collected) -> CloudWatch Logs, off-node.
# The identifiers are the units' SyslogIdentifier= (deploy/systemd) and the ops scripts' `logger -t` tags; the
# list must match gen_alerts.py LOG_FILES (tests/deploy checks both). Messages are written and then dropped
# (`stop`), so they are not duplicated into /var/log/syslog. The journal keeps its own copy on the node.

# rsyslog truncates a message at 8 KiB by default: an engine line carrying a traceback (`exc`, logs.py) would be
# cut mid-JSON and arrive in CloudWatch as an unparseable fragment. 64 KiB matches journald's LineMax
# (journald-xtnl.conf). Check with `sudo rsyslogd -N1`; if it reports maxMessageSize as set too late (after an
# input module), put this line at the top of /etc/rsyslog.conf instead.
global(maxMessageSize="64k")

template(name="XtnlRaw" type="list") {
    property(name="msg" regex.type="ERE" regex.expression="^ ?(.*)$" regex.submatch="1" droplastlf="on")
    constant(value="\n")
}
template(name="XtnlFile" type="string" string="/var/log/xtnl/%programname%.log")

if $programname == ["xtnl-engine", "xtnl-migrate", "xtnl-pitr-guard", "xtnl-pg-backup", "xtnl-etcd-defrag"] then {
    # group adm: the CloudWatch agent runs as `cwagent` (agent-prometheus.json run_as_user) and must read these
    # files; install-node.md adds cwagent to adm and pre-creates /var/log/xtnl as syslog:adm 0750.
    action(type="omfile" dynaFile="XtnlFile" template="XtnlRaw" dirCreateMode="0750" fileCreateMode="0640"
           dirOwner="syslog" dirGroup="adm" fileOwner="syslog" fileGroup="adm")
    stop
}
