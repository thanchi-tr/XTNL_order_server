# XTNL: make sure journald hands every message to rsyslog (logs/30-xtnl-rsyslog.conf), which writes the files
# the CloudWatch agent ships off-node. Install as /etc/systemd/journald.conf.d/xtnl.conf on both engine nodes,
# then `sudo systemctl restart systemd-journald`. LineMax covers the longest JSON log line.
[Journal]
ForwardToSyslog=yes
LineMax=64K
