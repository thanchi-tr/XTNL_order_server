# Alertmanager routing for the XTNL off-node alerts (operations.md §9). Phase 1 never sends orders: these
# only page people. Rules: ../prometheus/xtnl-alerts.rules.yml (generated by ../gen_alerts.py); metrics:
# ../metrics.md. Install as the Amazon Managed Service for Prometheus alert manager definition (or a self-run
# Alertmanager >= 0.25). Replace ${...} with envsubst; no secret is written here (SNS is reached with the
# workspace's IAM role through sigv4).
#
#   ${XTNL_SNS_CRITICAL_TOPIC_ARN}  SNS topic -> phone (critical pages); in a region outside eu-west-2
#                                   (ap-southeast-4, like the Melbourne dead-man path), so a London region
#                                   outage cannot silence it
#   ${XTNL_SNS_WARNING_TOPIC_ARN}   SNS topic -> email / chat (warnings)
#   ${XTNL_SNS_REGION}              region of both topics (e.g. ap-southeast-4)
#
# Inhibition (operations.md §9): an epoch change suppresses dependent alerts (lag, sync-degraded; labelled
# depends_on_epoch="true") for RTO + 30 s while XtnlEpochChangeSettling fires; whatever is still firing then
# goes out as ONE grouped notification (the summary), and repeats as the escalation.
# Declared maintenance windows suppress sync-degraded: add a silence for the window before it starts
#   amtool silence add alertname=XtnlSyncStandbyMissing --start=<ISO> --end=<ISO> --comment="<ticket>"
# (docs/runbooks/off-node-alerts.md).

global:
  resolve_timeout: 5m

route:
  receiver: sns-critical
  group_by: [alertname, subject, member, node]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m
  routes:
    # the inhibition source never notifies
    - matchers: ['severity="none"']
      receiver: blackhole
    # epoch-dependent alerts: one summary per settling window and severity, then escalation by repeat
    # (a warning such as replication / feed lag stays on the warning topic; only critical ones page)
    - matchers: ['depends_on_epoch="true"']
      receiver: sns-critical
      group_by: [depends_on_epoch, severity]
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 30m
      routes:
        - matchers: ['severity="warning"']
          receiver: sns-warning
          repeat_interval: 4h
    # SAFE_HOLD: one off-node page (operations.md §4); the operator resume clears it
    - matchers: ['alertname="XtnlSafeHold"']
      receiver: sns-critical
      repeat_interval: 24h
    - matchers: ['severity="critical"']
      receiver: sns-critical
    - matchers: ['severity="warning"']
      receiver: sns-warning
      repeat_interval: 4h

inhibit_rules:
  # operations.md §9: an epoch change suppresses dependent alerts for RTO + 30 s
  - source_matchers: ['alertname="XtnlEpochChangeSettling"']
    target_matchers: ['depends_on_epoch="true"']
  # no LEADER at all: the leader-only symptoms are implied
  - source_matchers: ['alertname="XtnlNoLeader"']
    target_matchers: ['alertname=~"XtnlLeaderNotOnPrimary|XtnlFeedLengthHigh|XtnlFeedPendingOld|XtnlLeaseRenewSlow"']
  # a node that exports nothing: its per-node symptoms are implied
  - source_matchers: ['alertname="XtnlEngineDown"']
    target_matchers: ['alertname=~"XtnlEventLoopLag|XtnlRedisMemoryHigh|XtnlClockOffset"']
    equal: [node]

receivers:
  - name: blackhole
  - name: sns-critical
    sns_configs:
      - topic_arn: ${XTNL_SNS_CRITICAL_TOPIC_ARN}
        sigv4:
          region: ${XTNL_SNS_REGION}
        subject: '[XTNL CRITICAL] {{ .GroupLabels.alertname }}{{ if .GroupLabels.depends_on_epoch }} (after epoch change){{ end }}'
        message: |-
          {{ range .Alerts }}{{ .Status | toUpper }} {{ .Labels.alertname }} {{ .Labels.node }}{{ .Labels.subject }}{{ .Labels.member }}
          {{ .Annotations.summary }}
          spec: {{ .Annotations.spec }}
          runbook: {{ .Annotations.runbook }}
          {{ end }}
        send_resolved: true
  - name: sns-warning
    sns_configs:
      - topic_arn: ${XTNL_SNS_WARNING_TOPIC_ARN}
        sigv4:
          region: ${XTNL_SNS_REGION}
        subject: '[XTNL warning] {{ .GroupLabels.alertname }}'
        message: |-
          {{ range .Alerts }}{{ .Status | toUpper }} {{ .Labels.alertname }} {{ .Labels.node }}{{ .Labels.subject }}{{ .Labels.member }}
          {{ .Annotations.summary }}
          runbook: {{ .Annotations.runbook }}
          {{ end }}
        send_resolved: true
