# pgBackRest template (Tier 3 immutable image; operations.md s7, s8). Install as /etc/pgbackrest/pgbackrest.conf
# (pgBackRest's default path, 0644) on both PostgreSQL members (archive_mode=always, so both push WAL) and on the
# DR stack. Replace ${...}. S3 credentials come from the instance role (repo1-s3-key-type=auto), never from this
# file.
#
# The repo is encrypted, and EVERY pgBackRest command needs the cipher passphrase: the archive_command and
# restore_command PostgreSQL runs under Patroni, Patroni's pgbackrest replica creation, xtnl-pitr-guard (timer and
# on_role_change callback), xtnl-pg-backup, stanza-create / check and the operator restore commands. None of them
# gets a systemd EnvironmentFile, so the passphrase is NOT an environment variable: it lives in the include file
#     /etc/pgbackrest/conf.d/xtnl-cipher.conf    0640 root:postgres   (template: pgbackrest-cipher.conf.example)
# rendered from Secrets Manager, which pgBackRest reads on every invocation (config-include-path default). Never set
# PGBACKREST_REPO1_CIPHER_PASS anywhere: an environment value would silently override the file for one caller.
# Check as postgres on each member: `pgbackrest --stanza=xtnl check` (archive-push + archive-get round trip).
#
# One-time setup (on the primary, as postgres):
#     pgbackrest --stanza=xtnl stanza-create
#     pgbackrest --stanza=xtnl check
# Schedule: deploy/systemd/xtnl-pg-backup.timer (enabled on both members; only the primary's run backs up)
# runs deploy/jobs/xtnl-pg-backup.sh daily: incremental, full on Saturday. By hand:
#     pgbackrest --stanza=xtnl --type=incr backup
#     pgbackrest --stanza=xtnl --type=full backup
# Restores are operator-run only, through Patroni (runbook disaster-restore-melbourne.md).

[global]
repo1-type=s3
# ap-southeast-4 bucket with S3 Object Lock (compliance mode). pgBackRest has NO inline comments: anything after
# '=' (a trailing '# ...' included) is the value, so every comment in this file sits on its own line.
repo1-s3-bucket=${PGBACKREST_BUCKET}
repo1-s3-region=ap-southeast-4
repo1-s3-endpoint=s3.ap-southeast-4.amazonaws.com
repo1-s3-key-type=auto
repo1-path=/xtnl-pg
repo1-retention-full=4
repo1-retention-diff=14
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass is in /etc/pgbackrest/conf.d/xtnl-cipher.conf (from Secrets Manager), never written here.
archive-async=y
# Past this queue pgBackRest acknowledges WAL without archiving it (a dropped WAL, operations.md s8). It can only
# happen after archive-push has been failing, which raises pg_stat_archiver.failed_count: XtnlPitrHorizonBroken
# fires and xtnl-pitr-guard retries an incremental backup every minute until one succeeds, i.e. after archiving
# works again and after the last drop. The cap keeps a long S3 outage from filling pg_wal on the primary.
archive-push-queue-max=4GiB
spool-path=/var/spool/pgbackrest
process-max=4
compress-type=zst
start-fast=y
delta=y
log-level-console=info
log-level-file=detail

[xtnl]
pg1-path=/var/lib/postgresql/17/main
pg1-port=5432
pg1-socket-path=/var/run/postgresql
