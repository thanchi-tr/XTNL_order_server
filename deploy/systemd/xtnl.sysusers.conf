# Dedicated system user for the engine and the migration job. Install as /etc/sysusers.d/xtnl.conf, then
#     sudo systemd-sysusers /etc/sysusers.d/xtnl.conf
# No login shell, no home outside the state directory, no sudo.
u xtnl - "XTNL Phase 1 engine (read-only ingestion)" /var/lib/xtnl /usr/sbin/nologin
