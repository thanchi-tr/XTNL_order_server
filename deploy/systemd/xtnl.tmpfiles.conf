# systemd-tmpfiles layout for an XTNL engine node. Install as /etc/tmpfiles.d/xtnl.conf, then
#     sudo systemd-tmpfiles --create /etc/tmpfiles.d/xtnl.conf
#
# /opt/xtnl/order-server          code + .venv, owned by root, read-only to the engine (ProtectSystem=strict)
# /etc/xtnl/engine.env            0640 root:xtnl, from deploy/env/engine.env.example (placeholders replaced)
# /etc/xtnl/migrate.env           optional, 0640 root:xtnl, ORDER_SERVER_DSN for the schema-owner role
# /var/lib/xtnl                   engine state (StateDirectory=xtnl): dlq_spill.jsonl (XTNL_SPILL_PATH)
# /var/lib/xtnl/archive           partition exports (XTNL_ARCHIVE_DIR): <parent>/<partition>.jsonl.gz + .sha256
# /var/lib/xtnl-pitr-guard       xtnl-pitr-guard state + lock (PostgreSQL members; the Patroni callback needs it)
# /opt/xtnl/order-server/var  ->  /var/lib/xtnl (the code's relative default var/dlq_spill.jsonl lands there too)
#
# Type Path                          Mode User  Group Age Argument
d     /etc/xtnl                      0750 root  xtnl  -   -
z     /etc/xtnl/engine.env           0640 root  xtnl  -   -
z     /etc/xtnl/migrate.env          0640 root  xtnl  -   -
d     /var/lib/xtnl                  0750 xtnl  xtnl  -   -
d     /var/lib/xtnl/archive          0750 xtnl  xtnl  -   -
d     /var/lib/xtnl-pitr-guard       0750 postgres postgres - -
L+    /opt/xtnl/order-server/var     -    -     -     -   /var/lib/xtnl
