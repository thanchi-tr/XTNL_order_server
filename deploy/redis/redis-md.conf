# Redis configuration for `redis-md`, the OPTIONAL market-data store of an XTNL engine node (design §A2, §A5, §C2;
# plan S37). Install as /etc/xtnl/redis-md.conf on engine nodes A and B; run by deploy/systemd/xtnl-redis-md.service,
# which is installed but NOT enabled: the operator enables it together with XTNL_MD_ENABLED=1 (runbook marketdata.md).
# Phase 1 never sends orders; this store holds ticks, bars and indicator values derived from the broker, nothing else.
#
# It is NOT the engine Redis (deploy/redis/redis.conf, 127.0.0.1:6379, disposable, wiped at every leader change):
#   * a separate process, port, data directory, ACL and memory budget, so it can never evict or slow the engine's keys;
#   * not a node health check, never read by LEADER_INIT, SM8 or the integrity worker; losing it marks series GAPPED
#     and the bootstrap / backfill rebuild the BROKER series (design §A7, §A13);
#   * one per node, not replicated; a node's data is trusted only while md:writer's epoch is the leader's (§A7).
# Redis 7.2 or newer is required (WAITAOF); the nodes run the same Redis 7.4 build as the engine Redis.

# --- network ----------------------------------------------------------------------------------------
# Loopback only, port 6381. Remote readers (the Melbourne dashboard, a future strategy service) come only through the
# second section of the node's mutual-TLS proxy (deploy/redis/redis-tls-proxy.conf, ${NODE_IP}:6382 -> 127.0.0.1:6381)
# as md_reader; the security group opens 6382 to the VPN CIDR only.
bind 127.0.0.1 -::1
port 6381
protected-mode yes
tcp-backlog 511
tcp-keepalive 30
timeout 0

# --- process ----------------------------------------------------------------------------------------
daemonize no
supervised systemd
loglevel notice
logfile ""
databases 16
hz 10
# The unit's StateDirectory (/var/lib/xtnl-redis-md, owned by redis, 0750).
dir /var/lib/xtnl-redis-md

# --- persistence (Q17): AOF everysec, no RDB snapshots ------------------------------------------------------
# An AOF that Redis still refuses to load: runbook marketdata.md "AOF aside" (move the directory aside, start empty,
# let the bootstrap and backfill rebuild the BROKER series; TICK history is gone).
save ""
appendonly yes
appendfsync everysec
aof-load-truncated yes
appenddirname "appendonlydir"
aof-use-rdb-preamble yes
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
stop-writes-on-bgsave-error no

# --- memory (design §A5 sizing: 8 symbols at full retention ~ 500 MB, so 1 GB sits near 50 %) -------------
# noeviction: a full store refuses writes loudly; md-writer sheds TICK data in a fixed order and pages at 70 %
# (and the off-node XtnlRedisMdMemoryHigh). The AOF rewrite fork's copy-on-write memory is not counted in maxmemory:
# its headroom is the unit's MemoryMax=2G (twice maxmemory). Change both together.
maxmemory 1gb
maxmemory-policy noeviction
lazyfree-lazy-user-flush yes
lazyfree-lazy-user-del yes
lazyfree-lazy-expire yes

# --- latency / observability ------------------------------------------------------------------------------
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 256
# The md Lua scripts (FLUSH, RETAIN, bootstrap) are bounded; a script running longer is a bug.
busy-reply-threshold 5000

# --- ACL -------------------------------------------------------------------------------------------------
# Rendered at every start from the secrets source by the unit's ExecStartPre
# (python -m src.ops.md_acl --env-file /etc/xtnl/engine.env --out /run/xtnl-redis-md/users.acl --group redis):
# the passwords come from XTNL_MD_REDIS_URL (md_writer) and XTNL_MD_REDIS_READER_URL (md_reader), written as
# '#<sha256 hex>' entries only. `user default off`; md_writer = md:* data commands, EVALSHA / SCRIPT LOAD, INFO,
# WAITAOF (never KEYS, SCAN, FLUSH*, CONFIG, ACL); md_reader = read-only GET / HGETALL / ZRANGE* / XRANGE / XREAD on
# md:* (never +@read); md_health = nopass, +ping only. No `user` line may appear in this file while aclfile is set.
aclfile /run/xtnl-redis-md/users.acl
