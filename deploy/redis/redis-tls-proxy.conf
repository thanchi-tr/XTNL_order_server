; XTNL Redis TLS proxy (stunnel) for the Melbourne dashboard (operations.md s9 Dashboard: "read-only over the
; VPN"; IMPLEMENTATION_PLAN 7.3). Install on engine nodes A and B as /etc/xtnl/redis-tls-proxy.conf, rendered with
;     NODE_IP=<this node's VPC ip> envsubst '${NODE_IP}' < deploy/redis/redis-tls-proxy.conf
; and run by deploy/systemd/xtnl-redis-tls-proxy.service. Phase 1 never sends orders; this only forwards bytes.
;
; * Redis stays bound to loopback (deploy/redis/redis.conf); this proxy is the only way in from the VPC.
; * Mutual TLS: the dashboard must present a client certificate issued by the internal CA (verifyChain), and
;   this server certificate must carry the node's VPC address as an IP SAN (the dashboard checks the hostname).
; * Behind it the dashboard authenticates as the read-only ACL user xtnl_dashboard (GET / HGETALL on
;   redis:boot_id, price:*, account_live:* only). Security group: 6380 from VPN_CIDR (Melbourne) only.
; * Certificates come from systemd LoadCredential= (the unit's credentials directory), never from this file.

foreground = yes
pid =
debug = notice

[xtnl-redis-dashboard]
accept = ${NODE_IP}:6380
connect = 127.0.0.1:6379
cert = /run/credentials/xtnl-redis-tls-proxy.service/tls.crt
key = /run/credentials/xtnl-redis-tls-proxy.service/tls.key
CAfile = /run/credentials/xtnl-redis-tls-proxy.service/client-ca.crt
verifyChain = yes
requireCert = yes
sslVersionMin = TLSv1.2
TIMEOUTidle = 600
