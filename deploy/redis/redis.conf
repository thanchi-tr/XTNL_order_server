# Redis 7.4 configuration template for an XTNL engine node (tier-persistence.md s1, s2; operations.md s1).
# Install as /etc/redis/redis.conf on engine nodes A and B. Each node has its OWN Redis, used only while
# that node is the engine leader (STANDBY flushes it on entry; LEADER_INIT runs FLUSHDB and SM8 rebuilds it).
#
# Redis is an intentional, DISPOSABLE duplicate of PostgreSQL. Nothing durable lives here:
#   * no RDB snapshots and no AOF: after a restart Redis has a new run_id, so redis:boot_id no longer
#     matches run_id:epoch, ActionGate denies everything and SM8 rebuilds from PostgreSQL (runbook
#     redis-loss.md). Persistence would only add fork latency (AOF is optional, tier-persistence.md s1).
#   * maxmemory-policy noeviction: entity keys, halt:state, redis:boot_id and the oversee:feed stream must
#     NEVER be evicted. A full Redis rejects writes loudly instead; alert on used_memory before the limit.

# --- network ----------------------------------------------------------------------------------------
# Loopback only. The Melbourne dashboard reaches this Redis over the VPN through the node's TLS proxy
# (deploy/redis/redis-tls-proxy.conf, xtnl-redis-tls-proxy.service: ${NODE_IP}:6380, mutual TLS -> 127.0.0.1:6379),
# authenticated as the read-only xtnl_dashboard user below; Redis itself never listens on the VPC address.
bind 127.0.0.1 -::1
port 6379
protected-mode yes
tcp-backlog 511
tcp-keepalive 30
timeout 0
# Optional local socket (then REDIS_URL=unix:///run/redis/redis.sock?db=0):
# unixsocket /run/redis/redis.sock
# unixsocketperm 770

# --- process ----------------------------------------------------------------------------------------
daemonize no
supervised systemd
loglevel notice
logfile ""
databases 16
hz 10

# --- persistence: none (disposable duplicate) ------------------------------------------------------------
save ""
appendonly no
appendfsync no
stop-writes-on-bgsave-error no

# --- memory -----------------------------------------------------------------------------------------
# Size per instance (16 GB node shared with PostgreSQL, etcd and the engine). Alert at 70 % of maxmemory.
maxmemory 2gb
maxmemory-policy noeviction
# FLUSHDB at LEADER_INIT / STANDBY entry frees memory in the background; keys are gone at once.
lazyfree-lazy-user-flush yes
lazyfree-lazy-user-del yes
lazyfree-lazy-expire yes

# --- latency / observability ------------------------------------------------------------------------------
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 256
# Lua (apply_state.lua, the light script, the halt:state CAS): bounded scripts only.
busy-reply-threshold 5000

# --- ACL ---------------------------------------------------------------------------------------------------
# The default user is disabled. The engine connects as xtnl_engine; REDIS_URL carries the user and password
# (redis://xtnl_engine:<password>@127.0.0.1:6379/0) from Secrets Manager. Replace the placeholder with the
# SHA-256 of the real password ('#<hex>'); Redis refuses to start while the placeholder is present.
# FLUSHDB (LEADER_INIT, STANDBY, integrity reconcile) and INFO (run_id for redis:boot_id) are @dangerous, so
# they are granted explicitly; everything else in @dangerous stays denied, FLUSHALL included (the engine
# flushes only its own database, IMPLEMENTATION_PLAN 4.8 / 4.9).
user default off
user xtnl_engine on #REPLACE_WITH_SHA256_HEX_OF_PASSWORD ~* &* +@all -@dangerous +flushdb +info +client|setinfo +client|setname +client|id
# Read-only dashboard user (Melbourne, over the VPN through the TLS proxy; operations.md s9 Dashboard). Least
# privilege, by key and by command: read-only access (%R~) to exactly the keys the dashboard reads
# (src/dashboard/views.py: redis:boot_id, price:*, account_live:*), no channels, and only GET / HGETALL plus the
# connection commands redis-py sends (PING health checks, SELECT, CLIENT SETINFO). Never +@read: it includes KEYS
# and SCAN, which could stall the engine's Redis. Its own password (Secrets Manager), as '#<sha256 hex>'.
user xtnl_dashboard on #REPLACE_WITH_SHA256_HEX_OF_DASHBOARD_PASSWORD resetkeys %R~redis:boot_id %R~price:* %R~account_live:* resetchannels -@all +get +hgetall +ping +select +client|setinfo
