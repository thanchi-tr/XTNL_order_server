[project]
name = "xtnl-order-server"
version = "0.1.0"
description = "XTNL Phase 1: read-only broker ingestion, pub-sub normalisation, tiered integrity and Oversee risk monitoring"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "lightstreamer-client-lib>=2.2",
    "aiohttp>=3.11",                          # Lightstreamer transport; socket_factory (SO_LINGER / TCP_USER_TIMEOUT) needs >= 3.11
    "websockets>=14",                         # cTrader Open API JSON over WebSocket (Pepperstone)
    "redis>=5.0",
    "asyncpg>=0.30",                          # PostgreSQL 17, binary protocol (skill stack standard)
    "uvloop>=0.21; sys_platform != 'win32'",  # event loop on the Linux engine nodes; stdlib loop on Windows dev
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.10", "fakeredis>=2.26", "lupa>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: end-to-end test against a real PostgreSQL and Redis (ORDER_SERVER_TEST_DSN, ORDER_SERVER_TEST_REDIS)",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["lightstreamer.*", "fakeredis.*", "lupa.*"]
ignore_missing_imports = true
