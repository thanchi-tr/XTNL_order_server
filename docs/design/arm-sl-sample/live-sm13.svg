<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Design 3 SM13: stop-move intent state machine</title>
<desc>Per stop-move intent: Proposed, Phase 3 approval, checks with retry, sending, acked or unknown, operator, and terminal states.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:'Segoe UI',system-ui,sans-serif}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.box{fill:#F8F7F3;stroke:#B4B2A9}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th{fill:#791F1F}.c-red>.ts{fill:#A32D2D}
</style>
<rect width="680" height="620" fill="#ffffff"/>
<g class="c-coral"><rect x="40" y="40" width="165" height="52" rx="8" stroke-width="0.8"/><text class="th" x="122.5" y="59" text-anchor="middle" dominant-baseline="central">Awaiting approval</text><text class="ts" x="122.5" y="77" text-anchor="middle" dominant-baseline="central">Phase 3: you decide</text></g>
<g class="c-gray"><rect x="265" y="40" width="150" height="52" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="59" text-anchor="middle" dominant-baseline="central">Proposed</text><text class="ts" x="340.0" y="77" text-anchor="middle" dominant-baseline="central">Bar-end ADJUST</text></g>
<g class="c-gray"><rect x="475" y="40" width="165" height="52" rx="8" stroke-width="0.8" stroke-dasharray="4 3"/><text class="th" x="557.5" y="59" text-anchor="middle" dominant-baseline="central">Cancelled · expired</text><text class="ts" x="557.5" y="77" text-anchor="middle" dominant-baseline="central">Superseded, closed, off</text></g>
<g class="c-coral"><rect x="40" y="150" width="165" height="52" rx="8" stroke-width="0.8"/><text class="th" x="122.5" y="169" text-anchor="middle" dominant-baseline="central">Approved</text><text class="ts" x="122.5" y="187" text-anchor="middle" dominant-baseline="central">Your OK committed</text></g>
<g class="c-gray"><rect x="265" y="150" width="150" height="52" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="169" text-anchor="middle" dominant-baseline="central">Checking</text><text class="ts" x="340.0" y="187" text-anchor="middle" dominant-baseline="central">Gate, re-read, price</text></g>
<g class="c-gray"><rect x="475" y="150" width="165" height="52" rx="8" stroke-width="0.8"/><text class="th" x="557.5" y="169" text-anchor="middle" dominant-baseline="central">Held</text><text class="ts" x="557.5" y="187" text-anchor="middle" dominant-baseline="central">Retry every 5 s</text></g>
<g class="c-gray"><rect x="40" y="260" width="165" height="52" rx="8" stroke-width="0.8" stroke-dasharray="4 3"/><text class="th" x="122.5" y="279" text-anchor="middle" dominant-baseline="central">Refused</text><text class="ts" x="122.5" y="297" text-anchor="middle" dominant-baseline="central">Final check failed</text></g>
<g class="c-amber"><rect x="265" y="260" width="150" height="52" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="279" text-anchor="middle" dominant-baseline="central">Sending</text><text class="ts" x="340.0" y="297" text-anchor="middle" dominant-baseline="central">Row first, then write</text></g>
<g class="c-amber"><rect x="475" y="260" width="165" height="52" rx="8" stroke-width="0.8"/><text class="th" x="557.5" y="279" text-anchor="middle" dominant-baseline="central">Unknown</text><text class="ts" x="557.5" y="297" text-anchor="middle" dominant-baseline="central">Never re-sent</text></g>
<g class="c-gray"><rect x="40" y="370" width="165" height="52" rx="8" stroke-width="0.8" stroke-dasharray="4 3"/><text class="th" x="122.5" y="389" text-anchor="middle" dominant-baseline="central">Broker rejected</text><text class="ts" x="122.5" y="407" text-anchor="middle" dominant-baseline="central">Paged once</text></g>
<g class="c-amber"><rect x="265" y="370" width="150" height="52" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="389" text-anchor="middle" dominant-baseline="central">Acked</text><text class="ts" x="340.0" y="407" text-anchor="middle" dominant-baseline="central">Confirm read ≤ 30 s</text></g>
<g class="c-red"><rect x="475" y="370" width="165" height="52" rx="8" stroke-width="0.8"/><text class="th" x="557.5" y="389" text-anchor="middle" dominant-baseline="central">Operator</text><text class="ts" x="557.5" y="407" text-anchor="middle" dominant-baseline="central">Critical page</text></g>
<g class="c-coral"><rect x="40" y="480" width="165" height="52" rx="8" stroke-width="0.8" stroke-dasharray="4 3"/><text class="th" x="122.5" y="499" text-anchor="middle" dominant-baseline="central">Rejected by you</text><text class="ts" x="122.5" y="517" text-anchor="middle" dominant-baseline="central">From awaiting approval</text></g>
<g class="c-teal"><rect x="265" y="480" width="150" height="52" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="499" text-anchor="middle" dominant-baseline="central">Confirmed</text><text class="ts" x="340.0" y="517" text-anchor="middle" dominant-baseline="central">Stop at target</text></g>
<g class="c-gray"><rect x="475" y="480" width="165" height="52" rx="8" stroke-width="0.8" stroke-dasharray="4 3"/><text class="th" x="557.5" y="499" text-anchor="middle" dominant-baseline="central">Not applied</text><text class="ts" x="557.5" y="517" text-anchor="middle" dominant-baseline="central">Or abandoned (operator)</text></g>
<path d="M265 66 H207" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="235.0" y="60" text-anchor="middle">P3</text>
<path d="M122.5 92 V148" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="130.5" y="126" text-anchor="start">you approve</text>
<path d="M205 176 H263" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M340.0 92 V148" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="348.0" y="126" text-anchor="start">P4 / P5</text>
<path d="M415 66 H473" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="445.0" y="60" text-anchor="middle">any*</text>
<path d="M415 168 H473" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="445.0" y="162" text-anchor="middle">retry</text>
<path d="M475 186 H417" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M290 202 V230 H122.5 V258" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="257" y="224" text-anchor="end">final fail</text>
<path d="M340.0 202 V258" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="348.0" y="236" text-anchor="start">all pass</text>
<path d="M415 286 H473" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="445.0" y="280" text-anchor="middle">lost</text>
<path d="M290 312 V340 H122.5 V368" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="257" y="334" text-anchor="end">refused</text>
<path d="M340.0 312 V368" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="348.0" y="346" text-anchor="start">accepted</text>
<path d="M415 396 H473" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="445.0" y="390" text-anchor="middle">no match</text>
<path d="M557.5 312 V368" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="565.5" y="346" text-anchor="start">unclear</text>
<path d="M340.0 422 V478" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="348.0" y="456" text-anchor="start">at target</text>
<path d="M557.5 422 V478" class="arr" fill="none" marker-end="url(#arrow)"/><text class="ts" x="565.5" y="456" text-anchor="start">resolves</text>
<g class="c-gray"><rect x="40" y="560" width="14" height="14" rx="3" stroke-width="0.8"/></g><text class="ts" x="60" y="571">Before send</text>
<g class="c-amber"><rect x="150.6" y="560" width="14" height="14" rx="3" stroke-width="0.8"/></g><text class="ts" x="170.6" y="571">In flight</text>
<g class="c-coral"><rect x="248.0" y="560" width="14" height="14" rx="3" stroke-width="0.8"/></g><text class="ts" x="268.0" y="571">Needs you</text>
<g class="c-red"><rect x="345.4" y="560" width="14" height="14" rx="3" stroke-width="0.8"/></g><text class="ts" x="365.4" y="571">Needs an operator</text>
<g class="c-teal"><rect x="495.59999999999997" y="560" width="14" height="14" rx="3" stroke-width="0.8"/></g><text class="ts" x="515.5999999999999" y="571">Moved</text>
<rect x="566.5999999999999" y="560" width="14" height="14" rx="3" fill="none" stroke="#888780" stroke-dasharray="3 2"/><text class="ts" x="586.5999999999999" y="571">Terminal</text>
<text class="ts" x="40" y="596">* From any state before Sending (superseded, closed, suspended, failed, disarmed, switch off, at target, expiry);</text>
<text class="ts" x="40" y="612">  Acked / Unknown end Cancelled only after a read shows the position closed. Unknown at target → Confirmed.</text>
</svg>