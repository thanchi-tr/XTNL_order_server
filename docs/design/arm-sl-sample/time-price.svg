<text fill="#444441" font-weight="600" x="40" y="472">Human actions (you) and their effect</text>
<rect x="40" y="482" width="612" height="58" rx="6" fill="#FAECE7" stroke="#993C1D"/>
<text x="52" y="499" fill="#712B13" font-weight="600">H1</text>
<text x="84" y="499" fill="#712B13" font-weight="600">10:03:20</text>
<text x="150" y="499" fill="#712B13" font-weight="600">You go long: fill 1.10000 with the stop at 1.09800.</text>
<text x="84" y="517" fill="#993C1D">Effect</text>
<text x="150" y="517" fill="#993C1D">Fixes entry 1.10000 and 1R = 0.00200. Armed within ~2 s; no notice is sent.</text>
<text x="150" y="533" fill="#993C1D">From now on the order-server checks this position at every bar end.</text>
<rect x="40" y="546" width="612" height="74" rx="6" fill="#FAECE7" stroke="#993C1D"/>
<text x="52" y="563" fill="#712B13" font-weight="600">H2</text>
<text x="84" y="563" fill="#712B13" font-weight="600">10:44:40</text>
<text x="150" y="563" fill="#712B13" font-weight="600">You tighten the stop to 1.09900, acting on heads-up 5.</text>
<text x="84" y="581" fill="#993C1D">Effect</text>
<text x="150" y="581" fill="#993C1D">Your real risk is now 0.5R, but bar 2 is still tested at 1.09800 (heads-up).</text>
<text x="150" y="597" fill="#993C1D">After bar 2, 1.09800 stays the test basis until a bar end confirms the trigger,</text>
<text x="150" y="613" fill="#993C1D">so acting on a heads-up cannot confirm itself. Trigger line stays at 1.10200.</text>
<rect x="40" y="626" width="612" height="74" rx="6" fill="#FAECE7" stroke="#993C1D"/>
<text x="52" y="643" fill="#712B13" font-weight="600">H3</text>
<text x="84" y="643" fill="#712B13" font-weight="600">11:04:00</text>
<text x="150" y="643" fill="#712B13" font-weight="600">You follow advice 8: stop to 1.10000 (break-even).</text>
<text x="84" y="661" fill="#993C1D">Effect</text>
<text x="150" y="661" fill="#993C1D">Risk is 0. No state change until the 11:15 bar end; heads-up 9 stays silent.</text>
<text x="150" y="677" fill="#993C1D">That bar end releases the position: COMPLETE at 11:16:11, Advice > Complete.</text>
<text x="150" y="693" fill="#993C1D">Without this move the advice stays outstanding and is re-checked every bar.</text>
<text fill="#444441" font-weight="600" x="40" y="728">Order-server actions (automatic, advice only, nothing sent to the broker)</text>
<text fill="#444441" font-weight="600" x="76" y="750" text-anchor="end">1</text>
<text fill="#5F5E5A" x="84" y="750">10:14:20</text>
<text fill="#5F5E5A" x="150" y="750">PRE bar 0: live 0.22R, below trigger; first-bar check pending. Email.</text>
<text fill="#444441" font-weight="600" x="76" y="768" text-anchor="end">2</text>
<text fill="#5F5E5A" x="84" y="768">10:15:11</text>
<text fill="#5F5E5A" x="150" y="768">POST bar 0: calm (range 1.18 × ATR14). 0.30R, below trigger. Armed > Tracking.</text>
<text fill="#444441" font-weight="600" x="76" y="786" text-anchor="end">3</text>
<text fill="#5F5E5A" x="84" y="786">10:29:20</text>
<text fill="#5F5E5A" x="150" y="786">PRE bar 1: live 0.80R, below trigger. Provisional email.</text>
<text fill="#444441" font-weight="600" x="76" y="804" text-anchor="end">4</text>
<text fill="#5F5E5A" x="84" y="804">10:30:11</text>
<text fill="#5F5E5A" x="150" y="804">POST bar 1: close 0.75R, below trigger. Decision row + email.</text>
<text fill="#444441" font-weight="600" x="76" y="822" text-anchor="end">5</text>
<text fill="#5F5E5A" x="84" y="822">10:44:20</text>
<text fill="#5F5E5A" x="150" y="822">PRE bar 2: live 1.08R > 1R. Heads-up: may advise 1.10000. Stop noted.</text>
<text fill="#444441" font-weight="600" x="76" y="840" text-anchor="end">6</text>
<text fill="#5F5E5A" x="84" y="840">10:45:11</text>
<text fill="#5F5E5A" x="150" y="840">POST bar 2: 0.95R vs 1R: not confirmed, basis 1.09800 kept. Email ratio 1.900*</text>
<text fill="#444441" font-weight="600" x="76" y="858" text-anchor="end">7</text>
<text fill="#5F5E5A" x="84" y="858">10:59:20</text>
<text fill="#5F5E5A" x="150" y="858">PRE bar 3: live 1.18R vs held basis 1R. Heads-up again (basis held).</text>
<text fill="#444441" font-weight="600" x="76" y="876" text-anchor="end">8</text>
<text fill="#5F5E5A" x="84" y="876">11:00:11</text>
<text fill="#5F5E5A" x="150" y="876">POST bar 3: close 1.15R > 1R. ADJUST: move stop to 1.10000. Basis cleared.</text>
<text fill="#444441" font-weight="600" x="76" y="894" text-anchor="end">9</text>
<text fill="#5F5E5A" x="84" y="894">11:14:20</text>
<text fill="#5F5E5A" x="150" y="894">PRE bar 4: stop already at target, no basis held. No PRE item, no email.</text>
<text fill="#444441" font-weight="600" x="76" y="912" text-anchor="end">10</text>
<text fill="#5F5E5A" x="84" y="912">11:15:11</text>
<text fill="#5F5E5A" x="150" y="912">POST bar 4: 1.30R > 0R, at target. Release held for a verification re-read.</text>
<text fill="#444441" font-weight="600" x="76" y="930" text-anchor="end">10a</text>
<text fill="#5F5E5A" x="84" y="930">11:16:00</text>
<text fill="#5F5E5A" x="150" y="930">No decision at T+60 s: part-0 email lists it as awaiting the final bar.*</text>
<text fill="#444441" font-weight="600" x="76" y="948" text-anchor="end">10b</text>
<text fill="#5F5E5A" x="84" y="948">11:16:11</text>
<text fill="#5F5E5A" x="150" y="948">Re-read confirms: COMPLETE, released. Part-1 email, marked DELAYED.*</text>
<text fill="#5F5E5A" x="84" y="972">* Current behaviour flagged in review: ratio uses the moved stop; every release is DELAYED.</text>
